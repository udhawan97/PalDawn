  <rect width="1200" height="630" fill="url(#field)"/>
  <g fill="none" stroke="#bab2d8" stroke-width="2">
    <ellipse cx="890" cy="674" rx="520" ry="248" opacity=".08"/>
    <ellipse cx="890" cy="674" rx="420" ry="198" opacity=".11"/>
    <ellipse cx="890" cy="674" rx="320" ry="148" opacity=".14"/>
  </g>
  <path d="M86 114 H1114" stroke="#ada4cc" stroke-opacity=".24"/>
