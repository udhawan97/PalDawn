<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">PalDawn — enter the body and follow what happens next</title>
  <desc id="description">The porcelain PalDawn listening mark and gold disc beside the product promise on a royal-violet field. Conceptual systems map, not reviewed anatomy.</desc>
  <defs>
    <radialGradient id="field" cx=".74" cy=".3" r=".82">
      <stop offset="0" stop-color="#302968"/>
      <stop offset=".38" stop-color="#151134"/>
      <stop offset=".72" stop-color="#0a0820"/>
      <stop offset="1" stop-color="#050412"/>
    </radialGradient>
    <linearGradient id="tube" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".44" stop-color="#efede4"/>
