  <text x="88" y="184" fill="#f3d98a" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="3">PAL · DAWN / MECHANISM LENS</text>
  <text x="88" y="300" fill="#f2ede0" font-family="Iowan Old Style, Palatino Linotype, Book Antiqua, Palatino, Georgia, serif" font-size="74" font-weight="600" letter-spacing="-1">Enter the body.</text>
