  <path d="M154 354 H562" stroke="#e0b653" stroke-opacity=".6"/>
  <text x="88" y="452" fill="#f2ede0" font-family="Iowan Old Style, Palatino Linotype, Book Antiqua, Palatino, Georgia, serif" font-size="68" font-weight="600" letter-spacing="-1">Follow what happens next.</text>
